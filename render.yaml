services:
  - type: web
    runtime: static
    name: sifra-ai-1
    rootDir: Frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://sifra-ai.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    runtime: python
    name: sifra-ai-rtho
    rootDir: ml-model
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT

  - type: web
    runtime: node
    name: sifra-ai
    rootDir: Backend
    plan: free
    buildCommand: npm ci && npx prisma generate
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: ML_SERVICE_URL
        value: https://sifra-ai-rtho.onrender.com