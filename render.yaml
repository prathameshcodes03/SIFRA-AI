services:
  - type: web
    runtime: static
    name: sifra-ai-1
    rootDir: Frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    runtime: python
    name: sifra-ai-ml
    rootDir: ml-model
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT

  - type: web
    runtime: node
    name: sifra-ai-backend
    rootDir: Backend
    plan: free
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    envVars:
      - key: PORT
        value: 3000
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: sifra-ai-ml
          property: host
